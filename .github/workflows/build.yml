name: Build Switch NRO

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize devkitPro pacman
        run: |
          dkp-pacman -Sy --noconfirm || true
          dkp-pacman -Sy --noconfirm || true

      - name: Install devkitPro toolchain
        run: |
          dkp-pacman -S --noconfirm switch-dev switch-cmake switch-pkg-config

      - name: Install available libraries
        run: |
          dkp-pacman -S --noconfirm \
            switch-curl \
            switch-mbedtls \
            switch-zlib \
            switch-bzip2 \
            switch-lwext4 \
            switch-libarchive \
            switch-freetype \
            switch-libpng \
            switch-libjpeg-turbo \
            switch-glm \
            switch-harfbuzz \
            switch-fribidi \
            dkp-meson-scripts \
            dkp-toolchain-vars \
            || echo "Some packages may be missing, continuing..."

      - name: Verify toolchain
        run: |
          which aarch64-none-elf-g++
          dkp-pacman -Q | grep switch | head -20

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchAudiobook.nro
          path: build/SwitchAudiobook.nro
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/SwitchAudiobook.nro
          generate_release_notes: true