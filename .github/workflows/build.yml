name: Build Switch NRO

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required switch packages
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-libnx \
            switch-borealis \
            switch-mpv \
            switch-openssl \
            switch-curl \
            switch-mbedtls \
            switch-zlib \
            switch-bzip2 \
            switch-freetype \
            switch-nlohmann-json
          echo "=== Installed switch packages ==="
          dkp-pacman -Q switch-libnx switch-borealis switch-mpv switch-openssl \
            switch-curl switch-mbedtls switch-zlib switch-bzip2 switch-freetype switch-nlohmann-json || true

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchAudiobook.nro
          path: build/SwitchAudiobook.nro
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/SwitchAudiobook.nro
          generate_release_notes: true
